name: Forge99 Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  build-release:
    name: Build (${{ matrix.os }} - ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: forge99.exe
            release_bin: forge99.exe
            archive_ext: zip

          # Linux x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary_name: forge99
            release_bin: forge99
            archive_ext: tar.gz

          # macOS Apple Silicon (M1/M2/M3)
          - os: macos-14
            target: aarch64-apple-darwin
            binary_name: forge99
            release_bin: forge99
            archive_ext: tar.gz

          # macOS Intel x86_64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary_name: forge99
            release_bin: forge99
            archive_ext: tar.gz

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Build Dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y lld libasound2-dev libudev-dev libx11-xcb-dev libxkbcommon-dev libwayland-dev libgtk-3-dev pkg-config
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=lld" >> "$GITHUB_ENV"

      - name: Run Test Suite
        run: cargo test --workspace --target ${{ matrix.target }}

      - name: Build Optimized Release Binary
        run: cargo build --release --bin forge99 --target ${{ matrix.target }}

      - name: Package Windows Artifacts (Inno Setup & Portable Zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Tag = "${{ github.ref_name }}"
          if (-not $Tag) { $Tag = "v0.25.0" }
          $DistDir = "dist/forge99-$Tag-windows-x64"
          New-Item -ItemType Directory -Path $DistDir -Force | Out-Null
          New-Item -ItemType Directory -Path "target/release" -Force | Out-Null

          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" (Join-Path $DistDir "${{ matrix.release_bin }}") -Force
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "target/release/forge99.exe" -Force
          Copy-Item README.md $DistDir -Force
          Copy-Item LICENSE-MIT $DistDir -Force
          Copy-Item LICENSE-APACHE $DistDir -Force
          Copy-Item CHANGELOG.md $DistDir -Force

          Compress-Archive -Path "$DistDir/*" -DestinationPath "dist/forge99-$Tag-windows-x64.zip" -Force

          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            iscc installer/forge99_setup.iss
          }

      - name: Package Unix Artifacts (tar.gz)
        if: runner.os != 'Windows'
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ]; then TAG="v0.25.0"; fi
          DIST_NAME="forge99-${TAG}-${{ matrix.target }}"
          DIST_DIR="dist/${DIST_NAME}"
          mkdir -p "${DIST_DIR}"

          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "${DIST_DIR}/${{ matrix.release_bin }}"
          chmod +x "${DIST_DIR}/${{ matrix.release_bin }}"
          cp README.md LICENSE-MIT LICENSE-APACHE CHANGELOG.md "${DIST_DIR}/"

          tar -czvf "dist/${DIST_NAME}.tar.gz" -C dist "${DIST_NAME}"

      - name: Publish Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.zip
            dist/*.exe
            dist/*.tar.gz
