[package]
name = "ut99-editor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Forge99 — Modern 64-bit 3D Level Editor for Unreal Tournament 99"
default-run = "forge99"

[[bin]]
name = "forge99"
path = "src/main.rs"

[dependencies]
ut99-format = { path = "../ut99-format" }
ut99-bsp = { path = "../ut99-bsp" }
glam.workspace = true
bytemuck.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
winit = { version = "0.30", features = ["rwh_06"] }
wgpu = { version = "24.0" }
egui = "0.31"
egui-wgpu = { version = "0.31", features = ["winit"] }
egui-winit = { version = "0.31", default-features = false, features = ["links"] }
egui_dock = "0.16"
image.workspace = true
rfd = "0.15"
pollster = "0.4"
serde.workspace = true
serde_json.workspace = true
