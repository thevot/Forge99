[workspace]
members = [
    "crates/ut99-format",
    "crates/ut99-bsp",
    "crates/ut99-editor",
]
resolver = "2"

[workspace.package]
version = "0.25.0"
edition = "2021"
authors = ["Nicola \"thevot\" Selenu", "Forge99 Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/thevot/Forge99"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
byteorder = "1.5"
glam = { version = "0.29", features = ["bytemuck", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
bytemuck = { version = "1.21", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tga"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"

[profile.test]
opt-level = 1


